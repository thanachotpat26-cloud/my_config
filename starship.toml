format = """
$character\
$directory\
$git_branch\
"""

[directory]
style = "bold fg:#EDBF9C"
format = "[$path]($style) "
truncation_length = 1

[git_branch]
style = "bold fg:#EF6B6B"
# format = "git:\\([$branch]($style)\\) "
format = "[git:\\(](bold fg:#7CD0DE)[$branch]($style)[\\)](bold fg:#7CD0DE) "

[character]
success_symbol = "[❯](fg:#7CD0DE)"
error_symbol = "[❯](fg:#bf616a)"
